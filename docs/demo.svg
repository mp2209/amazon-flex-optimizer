<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-label="Route optimizer demo: the demo shift and a 40-stop shift routed by four solvers"><style>text { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d7d7d2; white-space: pre } .cmd { fill: #8fd18f } .note { fill: #e0b46b } @keyframes l0 { 0%, 0.000% { opacity: 0 } 0.000%, 100% { opacity: 1 } } .l0 { animation: l0 28.59s infinite } @keyframes l1 { 0%, 1.182% { opacity: 0 } 1.232%, 100% { opacity: 1 } } .l1 { animation: l1 28.59s infinite } @keyframes l2 { 0%, 2.423% { opacity: 0 } 2.473%, 100% { opacity: 1 } } .l2 { animation: l2 28.59s infinite } @keyframes l3 { 0%, 3.661% { opacity: 0 } 3.711%, 100% { opacity: 1 } } .l3 { animation: l3 28.59s infinite } @keyframes l4 { 0%, 4.903% { opacity: 0 } 4.953%, 100% { opacity: 1 } } .l4 { animation: l4 28.59s infinite } @keyframes l5 { 0%, 6.145% { opacity: 0 } 6.195%, 100% { opacity: 1 } } .l5 { animation: l5 28.59s infinite } @keyframes l6 { 0%, 7.386% { opacity: 0 } 7.436%, 100% { opacity: 1 } } .l6 { animation: l6 28.59s infinite } @keyframes l7 { 0%, 8.628% { opacity: 0 } 8.678%, 100% { opacity: 1 } } .l7 { animation: l7 28.59s infinite } @keyframes l8 { 0%, 9.862% { opacity: 0 } 9.912%, 100% { opacity: 1 } } .l8 { animation: l8 28.59s infinite } @keyframes l9 { 0%, 11.103% { opacity: 0 } 11.153%, 100% { opacity: 1 } } .l9 { animation: l9 28.59s infinite } @keyframes l10 { 0%, 12.345% { opacity: 0 } 12.395%, 100% { opacity: 1 } } .l10 { animation: l10 28.59s infinite } @keyframes l11 { 0%, 13.571% { opacity: 0 } 13.621%, 100% { opacity: 1 } } .l11 { animation: l11 28.59s infinite } @keyframes l12 { 0%, 14.806% { opacity: 0 } 14.856%, 100% { opacity: 1 } } .l12 { animation: l12 28.59s infinite } @keyframes l13 { 0%, 16.047% { opacity: 0 } 16.097%, 100% { opacity: 1 } } .l13 { animation: l13 28.59s infinite } @keyframes l14 { 0%, 17.286% { opacity: 0 } 17.336%, 100% { opacity: 1 } } .l14 { animation: l14 28.59s infinite } @keyframes l15 { 0%, 36.063% { opacity: 0 } 36.113%, 100% { opacity: 1 } } .l15 { animation: l15 28.59s infinite } @keyframes l16 { 0%, 37.354% { opacity: 0 } 37.404%, 100% { opacity: 1 } } .l16 { animation: l16 28.59s infinite } @keyframes l17 { 0%, 38.596% { opacity: 0 } 38.646%, 100% { opacity: 1 } } .l17 { animation: l17 28.59s infinite } @keyframes l18 { 0%, 39.820% { opacity: 0 } 39.870%, 100% { opacity: 1 } } .l18 { animation: l18 28.59s infinite } @keyframes l19 { 0%, 41.059% { opacity: 0 } 41.109%, 100% { opacity: 1 } } .l19 { animation: l19 28.59s infinite } @keyframes l20 { 0%, 42.287% { opacity: 0 } 42.337%, 100% { opacity: 1 } } .l20 { animation: l20 28.59s infinite } @keyframes l21 { 0%, 43.530% { opacity: 0 } 43.580%, 100% { opacity: 1 } } .l21 { animation: l21 28.59s infinite } @keyframes l22 { 0%, 44.772% { opacity: 0 } 44.822%, 100% { opacity: 1 } } .l22 { animation: l22 28.59s infinite } @keyframes l23 { 0%, 45.998% { opacity: 0 } 46.048%, 100% { opacity: 1 } } .l23 { animation: l23 28.59s infinite } @keyframes l24 { 0%, 47.285% { opacity: 0 } 47.335%, 100% { opacity: 1 } } .l24 { animation: l24 28.59s infinite } @keyframes l25 { 0%, 66.003% { opacity: 0 } 66.053%, 100% { opacity: 1 } } .l25 { animation: l25 28.59s infinite } @keyframes l26 { 0%, 84.719% { opacity: 0 } 84.769%, 100% { opacity: 1 } } .l26 { animation: l26 28.59s infinite } @keyframes l27 { 0%, 85.960% { opacity: 0 } 86.010%, 100% { opacity: 1 } } .l27 { animation: l27 28.59s infinite }</style><rect width="760" height="560" rx="8" fill="#1d1f21"/><circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="36" cy="16" r="5" fill="#ffbd2e"/><circle cx="52" cy="16" r="5" fill="#27c93f"/><text x="16" y="54" class="l0 cmd" xml:space="preserve">$ python3 scripts/demo.py</text><text x="16" y="72" class="l1 note" xml:space="preserve"># The app&#x27;s demo shift: start at Georgia Aquarium, 8 stops in the order entered</text><text x="16" y="90" class="l2" xml:space="preserve">  1. Piedmont Park</text><text x="16" y="108" class="l3" xml:space="preserve">  2. Ponce City Market</text><text x="16" y="126" class="l4" xml:space="preserve">  3. Fox Theatre</text><text x="16" y="144" class="l5" xml:space="preserve">  4. Mercedes-Benz Stadium</text><text x="16" y="162" class="l6" xml:space="preserve">  5. World of Coca-Cola</text><text x="16" y="180" class="l7" xml:space="preserve">  6. Atlanta Botanical Garden</text><text x="16" y="198" class="l8" xml:space="preserve">  7. Oakland Cemetery</text><text x="16" y="216" class="l9" xml:space="preserve">  8. Lenox Square</text><text x="16" y="234" class="l10 note" xml:space="preserve"># Routing it on real Google road distances (saved, no API calls)</text><text x="16" y="252" class="l11" xml:space="preserve">  solver                      miles   saved      time</text><text x="16" y="270" class="l12" xml:space="preserve">  entered order               25.82                  </text><text x="16" y="288" class="l13" xml:space="preserve">  Nearest neighbor            17.06   34.0%    0.3 ms</text><text x="16" y="306" class="l14" xml:space="preserve">  2-opt                       16.94   34.4%    0.6 ms</text><text x="16" y="324" class="l15" xml:space="preserve">  OR-Tools                    16.93   34.4%     5.0 s</text><text x="16" y="342" class="l16" xml:space="preserve">  Brute force (check)         16.93   34.4%   14.2 ms</text><text x="16" y="360" class="l17 note" xml:space="preserve"># The shift summary panel, computed the way the app does</text><text x="16" y="378" class="l18" xml:space="preserve">  best algorithm OR-Tools: 16.93 mi, est. 34 min of driving</text><text x="16" y="396" class="l19" xml:space="preserve">  gas saved 8.9 mi ($2.23) vs. the entered order</text><text x="16" y="414" class="l20 note" xml:space="preserve"># A full 40-stop shift: random start and stops from 41 Atlanta places</text><text x="16" y="432" class="l21" xml:space="preserve">  solver                      miles   saved      time</text><text x="16" y="450" class="l22" xml:space="preserve">  entered order              218.69                  </text><text x="16" y="468" class="l23" xml:space="preserve">  Nearest neighbor            62.16   71.6%    0.3 ms</text><text x="16" y="486" class="l24" xml:space="preserve">  2-opt                       53.86   75.4%   13.2 ms</text><text x="16" y="504" class="l25" xml:space="preserve">  OR-Tools                    52.08   76.2%     5.0 s</text><text x="16" y="522" class="l26" xml:space="preserve">  OR-Tools (before the fix)   56.51   74.2%     5.0 s</text><text x="16" y="540" class="l27 note" xml:space="preserve"># The app runs brute force only up to 7 stops: 40 stops would be 40! orderings</text></svg>