<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="How far each solver is from the best route found">
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e4e3df;
      --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#383835;
        --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; } }
text { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink2); }
.title { font-size: 15px; font-weight: 600; fill: var(--ink); }
.lab { fill: var(--ink); }
.grid { stroke: var(--grid); stroke-width: 1; }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; }
.dot { stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="760" height="380" rx="8" fill="var(--surface)"/>
<text x="64" y="28" class="title">How far each solver is from the best route found</text>
<text x="64" y="47">Mean extra distance over the best route, 25 real-road Atlanta shifts per size</text>
<line class="grid" x1="64" x2="510" y1="328.0" y2="328.0"/>
<text x="56" y="332.0" text-anchor="end">0%</text>
<line class="grid" x1="64" x2="510" y1="275.2" y2="275.2"/>
<text x="56" y="279.2" text-anchor="end">5%</text>
<line class="grid" x1="64" x2="510" y1="222.4" y2="222.4"/>
<text x="56" y="226.4" text-anchor="end">10%</text>
<line class="grid" x1="64" x2="510" y1="169.6" y2="169.6"/>
<text x="56" y="173.6" text-anchor="end">15%</text>
<line class="grid" x1="64" x2="510" y1="116.8" y2="116.8"/>
<text x="56" y="120.8" text-anchor="end">20%</text>
<line class="grid" x1="64" x2="510" y1="64.0" y2="64.0"/>
<text x="56" y="68.0" text-anchor="end">25%</text>
<text x="64.0" y="348" text-anchor="middle">7 stops</text>
<text x="172.1" y="348" text-anchor="middle">15 stops</text>
<text x="307.3" y="348" text-anchor="middle">25 stops</text>
<text x="510.0" y="348" text-anchor="middle">40 stops</text>
<text x="287.0" y="370" text-anchor="middle">Stops per shift</text>
<path class="line" d="M64.0,328.0 L172.1,328.0 L307.3,328.0 L510.0,327.2" stroke="var(--s1)"/>
<circle class="dot" cx="64.0" cy="328.0" r="5" fill="var(--s1)"/>
<circle class="dot" cx="172.1" cy="328.0" r="5" fill="var(--s1)"/>
<circle class="dot" cx="307.3" cy="328.0" r="5" fill="var(--s1)"/>
<circle class="dot" cx="510.0" cy="327.2" r="5" fill="var(--s1)"/>
<path class="line" d="M64.0,315.7 L172.1,278.8 L307.3,280.5 L510.0,266.8" stroke="var(--s2)"/>
<circle class="dot" cx="64.0" cy="315.7" r="5" fill="var(--s2)"/>
<circle class="dot" cx="172.1" cy="278.8" r="5" fill="var(--s2)"/>
<circle class="dot" cx="307.3" cy="280.5" r="5" fill="var(--s2)"/>
<circle class="dot" cx="510.0" cy="266.8" r="5" fill="var(--s2)"/>
<path class="line" d="M64.0,202.0 L172.1,97.3 L307.3,88.6 L510.0,103.5" stroke="var(--s3)"/>
<circle class="dot" cx="64.0" cy="202.0" r="5" fill="var(--s3)"/>
<circle class="dot" cx="172.1" cy="97.3" r="5" fill="var(--s3)"/>
<circle class="dot" cx="307.3" cy="88.6" r="5" fill="var(--s3)"/>
<circle class="dot" cx="510.0" cy="103.5" r="5" fill="var(--s3)"/>
<path class="line" d="M64.0,121.9 L172.1,219.9 L307.3,273.4 L510.0,262.2" stroke="var(--s4)"/>
<circle class="dot" cx="64.0" cy="121.9" r="5" fill="var(--s4)"/>
<circle class="dot" cx="172.1" cy="219.9" r="5" fill="var(--s4)"/>
<circle class="dot" cx="307.3" cy="273.4" r="5" fill="var(--s4)"/>
<circle class="dot" cx="510.0" cy="262.2" r="5" fill="var(--s4)"/>
<circle cx="524" cy="99.5" r="5" fill="var(--s3)"/>
<text x="534" y="103.5" class="lab">Nearest neighbor <tspan>21%</tspan></text>
<circle cx="524" cy="258.2" r="5" fill="var(--s4)"/>
<text x="534" y="262.2" class="lab">OR-Tools before the fix <tspan>6%</tspan></text>
<circle cx="524" cy="274.2" r="5" fill="var(--s2)"/>
<text x="534" y="278.2" class="lab">2-opt <tspan>6%</tspan></text>
<circle cx="524" cy="322.0" r="5" fill="var(--s1)"/>
<text x="534" y="326.0" class="lab">OR-Tools <tspan>0%</tspan></text>
</svg>